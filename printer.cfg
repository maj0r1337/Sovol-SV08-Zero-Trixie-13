[quad_gantry_level]          
gantry_corners:              
	-60,-10
	410,420
points:
	36,15
	36,300
	350,300
	350,15
speed: 500                  
horizontal_move_z: 10       
retry_tolerance: 0.05      
retries: 5                   
max_adjust: 10

[multi_pin print_cooling_fan_pins]
pins: extra_mcu:PA7, extra_mcu:PB1

# print/part cooling fan
[fan]
pin: extra_mcu:PB0
max_power: 1.0
cycle_time: 0.015

