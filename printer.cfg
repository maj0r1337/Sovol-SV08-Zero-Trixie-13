[extruder]
step_pin: extra_mcu:PA8   
dir_pin: extra_mcu:PA9    
enable_pin: !extra_mcu: PA11   
rotation_distance: 6.5 
microsteps: 16                
full_steps_per_rotation: 200 
nozzle_diameter: 0.400        
filament_diameter: 1.75  
max_extrude_only_distance: 150
max_extrude_cross_section: 5 #60
heater_pin: extra_mcu:PB7  
sensor_type: my_thermistor_e  
pullup_resistor: 11500
sensor_pin: extra_mcu:PA5  
min_temp: 0                  
max_temp: 355                 
max_power: 1.0                
min_extrude_temp: 150
#control = pid
#pid_kp = 30.517
#pid_ki = 3.569
#pid_kd = 65.230
pressure_advance: 0.025       
pressure_advance_smooth_time: 0.025

[tmc2209 extruder]
uart_pin: extra_mcu:PA12  
interpolate: True             
run_current: 0.8           
#hold_current: 0.75             
uart_address:3
sense_resistor: 0.150          

[verify_heater extruder]      
max_error: 120                
check_gain_time:30           
hysteresis: 5                
heating_gain: 2               

[filament_switch_sensor filament_sensor]
pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5
switch_pin: PE9

[heater_bed]
heater_pin:PA0
sensor_type: Generic 3950 #ATC Semitec 104GT-2 #my_thermistor 
sensor_pin: PC5
max_power: 1.0               
min_temp: 5                  
max_temp: 105                
#control : pid
#pid_kp : 73.571
#pid_ki : 1.820
#pid_kd : 783.849

[verify_heater heater_bed]      
max_error: 120                
check_gain_time:40           
hysteresis: 5                
heating_gain: 2 

